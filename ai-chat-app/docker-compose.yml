version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/src:/app/src
      - ./backend/requirements.txt:/app/requirements.txt
    ports:
      - "8000:8000"
    environment:
      - ENV=development

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chromadb:latest
    ports:
      - "8001:8001"